name: BHUMI Live Source Smoke Tests

on:
  workflow_dispatch:

concurrency:
  group: bhumi-live-source-smoke-tests
  cancel-in-progress: false

jobs:
  smoke_tests:
    name: Run Live Source Health & Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
      CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System and Pipeline Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libeccodes-dev
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Execute Live Source Smoke Test Suite
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          python -m unittest discover -s tests/live -v
