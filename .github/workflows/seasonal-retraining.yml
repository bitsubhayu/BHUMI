name: BHUMI Seasonal Model Retraining
# Cadence: Twice per year (Pre-Kharif in May, Pre-Rabi in October) as specified in TECH_STACK.md §4 & §5.
# NEVER run daily to prevent catastrophic forgetting and maintain engineering stability.

on:
  schedule:
    # 1 May (Pre-Kharif) at 00:00 UTC
    - cron: '0 0 1 5 *'
    # 1 October (Pre-Rabi) at 00:00 UTC
    - cron: '0 0 1 10 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate retraining without saving model artifacts'
        type: boolean
        default: false

concurrency:
  group: bhumi-model-retraining
  cancel-in-progress: false

jobs:
  retrain_models:
    name: Execute Seasonal Offline Model Retraining
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Run Deterministic Unit Tests
        run: |
          python -m unittest discover -s tests/unit

      - name: Execute Seasonal Retraining
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi
          python -m pipeline.jobs.retrain_models $EXTRA_ARGS

      - name: Validate Generated Artifacts
        if: ${{ inputs.dry_run != true }}
        run: |
          python -c "
          import json
          from pathlib import Path
          from pipeline.ml.downscaling.classifiers import DownscalingEnsemble
          from pipeline.ml.calibration.calibrator import ProbabilityCalibrator

          art_dir = Path('pipeline/ml/artifacts')
          meta_file = art_dir / 'metadata.json'
          assert meta_file.exists(), 'metadata.json missing'
          with open(meta_file, 'r', encoding='utf-8') as f:
              meta = json.load(f)
          assert 'model_version' in meta, 'model_version missing'
          assert 'trained_at' in meta, 'trained_at missing'
          assert 'model_readiness' in meta, 'model_readiness missing'

          DownscalingEnsemble.load(art_dir)
          ProbabilityCalibrator.load(art_dir / 'calibrator.json')
          print('Artifact validation succeeded: version =', meta['model_version'])
          "

      - name: Commit and Publish Authoritative Artifacts to Repository
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline/ml/artifacts/
          if git diff --staged --quiet; then
            echo "No changes in model artifacts to commit."
          else
            git commit -m "chore(ml): update authoritative seasonal model artifacts [skip ci]"
            git push origin main
          fi

      - name: Upload Trained Model Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bhumi-model-artifacts
          path: pipeline/ml/artifacts/
          retention-days: 90
