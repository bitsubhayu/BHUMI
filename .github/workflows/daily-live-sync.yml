name: BHUMI Daily Live Synchronization

on:
  schedule:
    # Runs daily at 00:30 UTC (06:00 AM IST)
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate without writing to database'
        type: boolean
        default: false
      days:
        description: 'Number of recent days to synchronize'
        type: string
        default: '7'
      sample_only:
        description: 'Run on small representative sample only'
        type: boolean
        default: false

      allow_experimental:
        description: 'Allow running inference with experimental/unready model'
        type: boolean
        default: false

concurrency:
  group: bhumi-daily-sync
  cancel-in-progress: false

jobs:
  daily_sync:
    name: Execute Daily Weather & Teleconnections Sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
      CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System and Pipeline Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libeccodes-dev
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Run Deterministic Pipeline Tests
        run: |
          python -m unittest discover -s tests/unit

      - name: Report Model Readiness Status
        run: |
          python -c "
          from pipeline.ml.inference import ProductionInferenceEngine
          from pipeline.utils.config import get_pipeline_config
          engine = ProductionInferenceEngine(config=get_pipeline_config(), dry_run=True)
          print('=' * 60)
          print('BHUMI MODEL READINESS REPORT')
          print('=' * 60)
          print(f'Status:           {engine.readiness.get(\"status\")}')
          print(f'Model Tier:       {engine.model_tier}')
          print(f'Production Ready: {engine.is_production_ready}')
          for r in engine.readiness.get('reasons', []):
              print(f' - {r}')
          print('=' * 60)
          "

      - name: Execute Daily Live Synchronization and Prediction
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          if [ "${{ inputs.sample_only }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --sample-only"
          fi
          # NEVER allow experimental in scheduled cron runs; only allowed on manual dispatch when explicitly chosen
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.allow_experimental }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --allow-experimental"
          fi
          DAYS="${{ inputs.days || '7' }}"

          echo "Starting daily operational pipeline..."
          python -m pipeline.jobs.daily_sync --days "$DAYS" $EXTRA_ARGS
